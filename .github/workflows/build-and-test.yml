name: Build and test

on:
  push:
    branches-ignore:
      - "renovate/**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  NUKE_TELEMETRY_OPTOUT: "1"
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore, compile and test
        run: ./build.sh TestReport --configuration Release --verbosity minimal

      - name: Verify generated registration with NativeAOT
        run: |
          dotnet publish Tests/Graph.AotSmoke/Graph.AotSmoke.csproj -c Release -f net10.0 -r linux-x64 -p:PublishAot=true -p:NoLocalPackages=true -m:4 -nodeReuse:false -o artifacts/aot-smoke
          ./artifacts/aot-smoke/Graph.AotSmoke

      - name: Verify the analyzer package in a core-only user assembly
        run: |
          VERSION=0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
          dotnet pack Graph.Generator/Graph.Generator.csproj -c Release -p:Version=$VERSION -o artifacts/packages
          dotnet run --project Samples/Graph.Samples.CustomNodes -c Release -f net10.0 -p:UseAnalyzerPackage=true -p:AnalyzerPackageVersion=$VERSION

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
